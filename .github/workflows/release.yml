name: Release

# Pushing a tag v<version> (e.g. v1.10) tests the code, builds the Windows package and
# publishes a GitHub Release with the zip ready to download. The tag must match the
# version in main.go and CHANGELOG.md must have a section for it.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# The compiler of every build and release: keep it equal to the toolchain line of go.mod
# (scripts/build-release.sh stops if they differ).
env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify, vet and test
        run: |
          go mod verify
          go vet ./...
          go test -count=1 ./...
          GOOS=windows go vet ./...
      - name: Build the package
        run: bash scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/gofm-$v-windows.zip" "dist/gofm-$v-windows.zip.sha256" \
            --title "gofm $v" --notes-file dist/release-notes.md --verify-tag
