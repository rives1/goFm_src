name: CI

on:
  push:
    branches: ['**'] # tags are handled by release.yml
  pull_request:

permissions:
  contents: read

# The compiler of every build and release: keep it equal to the toolchain line of go.mod
# (scripts/build-release.sh stops if they differ).
env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build the Windows package
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gofm-windows
          path: dist/*.zip
